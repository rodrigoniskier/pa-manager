[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pa-manager"
version = "1.0.0"
description = "Painel pessoal para verificar, renovar e recarregar web apps do PythonAnywhere."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Niskier" }]
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
pa-manager = "pa_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pa_manager"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
