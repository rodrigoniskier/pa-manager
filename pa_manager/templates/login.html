{% extends "base.html" %}
{% block title %}Entrar · PA Manager{% endblock %}
{% block shell_class %}login-shell{% endblock %}
{% block content %}
  <section class="login-card">
    <div class="login-mark">PA</div>
    <p class="eyebrow">ACESSO PESSOAL</p>
    <h1>PA Manager</h1>
    <p class="muted">Monitore e mantenha seus web apps PythonAnywhere em um só lugar.</p>
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    <form action="/login" method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button button-primary button-wide" type="submit">Entrar com segurança</button>
    </form>
  </section>
{% endblock %}
